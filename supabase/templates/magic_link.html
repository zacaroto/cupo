<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Tu enlace de acceso a cupo</title>
  </head>
  <body style="font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1f2937; line-height: 1.5;">
    <h2 style="margin: 0 0 16px;">Tu enlace de acceso</h2>
    <p>Usá el siguiente enlace para entrar a cupo:</p>
    <p>
      <a href="{{ .RedirectTo }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=magiclink"
         style="display: inline-block; padding: 10px 16px; background: #0f766e; color: #ffffff; text-decoration: none; border-radius: 6px;">
        Entrar a cupo
      </a>
    </p>
    <p style="color: #6b7280; font-size: 14px;">El enlace vence en 15 minutos y se usa una sola vez. Si no lo pediste, ignorá este correo.</p>
  </body>
</html>
