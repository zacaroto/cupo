name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # KTD11: lint, typecheck, unit tests, build and the secret-not-bundled grep.
  # The `db` job (local Supabase stack, pgTAP and the Vitest db project) is added in U2.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        # Canary values: the secret key matches the grep regex below, so the
        # "Secret key not bundled" step is a real check, not a vacuous one.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cicanary_0000000000000000
          SUPABASE_SECRET_KEY: sb_secret_cicanary_000000000000000000000000
        run: npm run build -w @cupo/web

      - name: Secret key not bundled
        # A real Supabase secret key is `sb_secret_` followed by a long base62 body.
        # @supabase/supabase-js itself contains the bare literal "sb_secret_" in a
        # startsWith() check, so the bare prefix is not a usable signal once U3
        # bundles the client; the length requirement is what separates a key from
        # the library string. The Build step injects a canary SUPABASE_SECRET_KEY
        # that matches this regex, so a leak into the bundle is actually detectable.
        run: |
          set -euo pipefail
          if [ ! -d apps/web/.next ]; then
            echo "::error::apps/web/.next does not exist; the build did not produce output."
            exit 1
          fi
          rc=0
          out=$(grep -rIEl 'sb_secret_[A-Za-z0-9_-]{20,}' apps/web/.next) || rc=$?
          case "$rc" in
            0)
              echo "::error::A Supabase secret key is present in the Next.js build output:"
              echo "$out"
              exit 1
              ;;
            1)
              echo "No secret key found in apps/web/.next"
              ;;
            *)
              echo "::error::grep failed with exit code $rc while scanning apps/web/.next"
              exit 1
              ;;
          esac
