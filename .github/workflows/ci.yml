name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # KTD11: lint, typecheck, unit tests, build and the secret-not-bundled grep.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        # Canary values: the secret key matches the grep regex below, so the
        # "Secret key not bundled" step is a real check, not a vacuous one.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cicanary_0000000000000000
          SUPABASE_SECRET_KEY: sb_secret_cicanary_000000000000000000000000
        run: npm run build -w @cupo/web

      - name: Secret key not bundled
        # A real Supabase secret key is `sb_secret_` followed by a long base62 body.
        # @supabase/supabase-js itself contains the bare literal "sb_secret_" in a
        # startsWith() check, so the bare prefix is not a usable signal once U3
        # bundles the client; the length requirement is what separates a key from
        # the library string. The Build step injects a canary SUPABASE_SECRET_KEY
        # that matches this regex, so a leak into the bundle is actually detectable.
        run: |
          set -euo pipefail
          if [ ! -d apps/web/.next ]; then
            echo "::error::apps/web/.next does not exist; the build did not produce output."
            exit 1
          fi
          rc=0
          out=$(grep -rIEl 'sb_secret_[A-Za-z0-9_-]{20,}' apps/web/.next) || rc=$?
          case "$rc" in
            0)
              echo "::error::A Supabase secret key is present in the Next.js build output:"
              echo "$out"
              exit 1
              ;;
            1)
              echo "No secret key found in apps/web/.next"
              ;;
            *)
              echo "::error::grep failed with exit code $rc while scanning apps/web/.next"
              exit 1
              ;;
          esac

  # KTD11: the database job always runs and reports (it is a required check), so
  # path detection lives inside the job rather than in a workflow-level `paths`
  # filter. When nothing database-related changed on a pull request, the
  # expensive steps are skipped with a notice and the job still succeeds.
  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned to the version developers run through `npx supabase` (3.1.0).
      SUPABASE_CLI_VERSION: 3.1.0
      SUPABASE_START_EXCLUDE: studio,storage-api,realtime,edge-runtime,logflare,vector,imgproxy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect database changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: running the full database job."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF"...HEAD -- \
            supabase/ tests/db/ scripts/ packages/shared/src/database.types.ts \
            package.json package-lock.json vitest.config.ts tsconfig.json tsconfig.base.json \
            .github/workflows/ci.yml || true)
          if [ -z "$changed" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=db job skipped::No database-related files changed in this pull request; the local stack, pgTAP, the Vitest db project and the migration preflight were skipped."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            printf 'Database-related changes:\n%s\n' "$changed"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.changes.outputs.run == 'true'
        run: npm ci

      - uses: supabase/setup-cli@v3
        if: steps.changes.outputs.run == 'true'
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local stack
        if: steps.changes.outputs.run == 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # The stack binds host ports 54321-54329, which sit inside Linux's default
          # ephemeral range (32768-60999). Image pulls open many outbound
          # connections, and one of them can hold a stack port just before Docker
          # binds it ("address already in use"). Move ephemeral ports above 55000.
          sudo sysctl -w net.ipv4.ip_local_port_range="55000 65000"
          if ! supabase start -x "$SUPABASE_START_EXCLUDE"; then
            echo "::warning::supabase start failed; retrying once after supabase stop --no-backup"
            supabase stop --no-backup || true
            supabase start -x "$SUPABASE_START_EXCLUDE"
          fi

      - name: Rebuild database from zero
        if: steps.changes.outputs.run == 'true'
        run: supabase db reset

      - name: Seed users
        if: steps.changes.outputs.run == 'true'
        run: npm run db:seed-users

      - name: pgTAP
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          # `supabase test db` exits 0 when no test files exist; guard against an emptied directory.
          test -n "$(ls supabase/tests/*.sql 2>/dev/null)" || { echo "::error::supabase/tests has no pgTAP files"; exit 1; }
          supabase test db

      - name: Database suite
        if: steps.changes.outputs.run == 'true'
        run: npm run test:db

      - name: Generated types are current
        if: steps.changes.outputs.run == 'true'
        run: npm run db:types -- --check

      # Migration preflight against cupo-dev (KTD11): the set of migrations that
      # `db push --dry-run` would apply must equal exactly the migration files
      # this pull request adds. Skips with a notice when the secrets are absent
      # (forks, or a repository without the values in README "GitHub secrets and
      # variables"). CLI 3.x: `--remote` replaces the former `--linked`; `link`
      # reads SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD from the environment.
      - name: Migration preflight against cupo-dev
        if: steps.changes.outputs.run == 'true' && github.event_name == 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_DEV }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF_DEV }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::notice title=Migration preflight skipped::SUPABASE_ACCESS_TOKEN_DEV, SUPABASE_DB_PASSWORD_DEV (secrets) or SUPABASE_PROJECT_REF_DEV (variable) is not available; the preflight against cupo-dev did not run."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
          echo "::group::supabase migration list --remote"
          supabase migration list --remote
          echo "::endgroup::"
          echo "::group::supabase db push --dry-run --remote"
          supabase db push --dry-run --remote --output-format json | tee dry-run.json
          echo "::endgroup::"
          # The JSON line is the last line of the output: {"upToDate":...,"dryRun":true,"migrations":["<file>.sql", ...],...}
          pending=$(tail -n 1 dry-run.json | jq -r '.migrations[]' | sort -u)
          added=$(git diff --name-only --diff-filter=A "origin/$BASE_REF"...HEAD -- supabase/migrations | xargs -n1 basename 2>/dev/null | sort -u || true)
          printf 'Pending on cupo-dev:\n%s\n\nAdded by this pull request:\n%s\n' "${pending:-<none>}" "${added:-<none>}"
          if [ "$pending" != "$added" ]; then
            echo "::error::The migrations pending on cupo-dev do not match the files this pull request adds. Rebase the migration timestamps or sync cupo-dev first (README, Migrations)."
            exit 1
          fi
